workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.populive.app
    integrations:
      app_store_connect: populive_asc
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Installa dipendenze
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Sincronizza Capacitor iOS
        script: npx cap sync ios
      - name: Numero di build incrementale
        script: |
          # BUILD_NUMBER è fornito da Codemagic e cresce a ogni build:
          # TestFlight rifiuta due upload con lo stesso numero.
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Firma automatica
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # Capacitor 8 usa Swift Package Manager (niente CocoaPods e niente
          # .xcworkspace): si compila direttamente il .xcodeproj.
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Il gruppo interno "Interni" ha la distribuzione automatica: riceve
        # ogni build da solo (e Apple non permette di assegnargliele via API).
        submit_to_testflight: true

  android-debug-apk:
    name: Android → APK di debug
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Installa dipendenze
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Sincronizza Capacitor Android
        script: npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
